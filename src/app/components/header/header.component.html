<header>
  <div class="header__content">
    <h3 class="header__content-welcome">
      {{ welcomeMessage | titlecase }}, Minh Trí
    </h3>

    <p class="header__content-date">Today, {{ date | date }}</p>
  </div>

  <div class="header__actions">
    <div class="header__actions-more">
      <hugeicons-icon
        [icon]="Menu01Icon"
        [size]="24"
        [strokeWidth]="1.5"
      ></hugeicons-icon>
    </div>
  </div>
</header>
